<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como a Startpage funciona</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --accent-tint: rgba(191, 69, 32, 0.08);
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }

    main { width: min(100%, 1120px); min-width: 0; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font: 500 8px var(--mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 400 32px/1.1 var(--serif);
    }
    .subtitle {
      margin: 10px 0 28px;
      color: var(--muted);
      font: 400 12px/1.5 var(--sans);
    }
    .diagram-container {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
    }
    svg {
      display: block;
      width: 100%;
      min-width: 960px;
      font-family: var(--sans);
    }
    @media print {
      body { display: block; padding: 16px; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Arquitetura · aplicação client-side</p>
    <h1>Como a Startpage funciona</h1>
    <p class="subtitle">Favoritos vêm de um arquivo local; busca, interface e preferências vivem no navegador.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Como a Startpage funciona</title>
        <desc id="architecture-desc">A aplicação carrega favoritos de YAML, usa js-yaml para interpretá-los, renderiza a interface no navegador e lê ou grava preferências no armazenamento local.</desc>

          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

          </marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="960" height="600" fill="#f5f5f5"/>

        <rect x="264" y="112" width="624" height="344" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="280" y="116" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="334" y="125" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.14em">NAVEGADOR</text>

        <path d="M208 228 H312" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <path d="M488 236 H584" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M400 260 V336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M488 220 H512 Q520 220 520 228 V344 Q520 352 528 352 H584" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M584 376 H544 Q536 376 536 368 V252 Q536 244 528 244 H488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <text x="260" y="217" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">FETCH</text>
        <rect x="512" y="216" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="536" y="225" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">RENDER</text>
        <rect x="408" y="292" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="428" y="301" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">PARSE</text>
        <rect x="472" y="280" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="492" y="289" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">SAVE</text>
        <rect x="544" y="304" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="564" y="313" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">LOAD</text>

        <g>
          <rect x="48" y="196" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
          <rect x="56" y="202" width="44" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
          <text x="78" y="211" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.08em">CONFIG</text>
          <text x="128" y="233" text-anchor="middle" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">bookmarks.yaml</text>
          <text x="128" y="249" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">categorias e links</text>
        </g>

        <g>
          <rect x="312" y="196" width="176" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <rect x="320" y="202" width="32" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>

          <text x="400" y="249" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">app.js · busca e eventos</text>
        </g>

        <g>
          <rect x="584" y="196" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="592" y="202" width="40" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="612" y="211" text-anchor="middle" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.08em">VIEW</text>
          <text x="672" y="233" text-anchor="middle" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Interface</text>
          <text x="672" y="249" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">index.html · style.css</text>
        </g>

        <g>
          <rect x="312" y="336" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <rect x="320" y="342" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
          <text x="336" y="351" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.08em">LIB</text>
          <text x="400" y="373" text-anchor="middle" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">js-yaml</text>
          <text x="400" y="389" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">vendor · parser YAML</text>
        </g>

        <g>
          <rect x="584" y="336" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
          <rect x="592" y="342" width="48" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
          <text x="616" y="351" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.08em">STORE</text>
          <text x="672" y="373" text-anchor="middle" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Preferências</text>
          <text x="672" y="389" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">localStorage</text>
        </g>

        <line x1="32" y1="492" x2="928" y2="492" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="524" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.14em">TIPOS</text>

        <rect x="184" y="514" width="14" height="14" rx="3" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="206" y="525" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">CONFIG</text>
        <rect x="328" y="514" width="14" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="350" y="525" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">APP</text>
        <rect x="472" y="514" width="14" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="494" y="525" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">VIEW</text>
        <rect x="616" y="514" width="14" height="14" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="638" y="525" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">LIB</text>
        <rect x="760" y="514" width="14" height="14" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="782" y="525" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">STORE</text>
      </svg>
    </div>
  </main>
</body>
</html>

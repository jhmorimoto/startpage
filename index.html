<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startpage</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Inline and before the CSS paints: avoids flashing the wrong theme/size on load.
    (function () {
      var saved = null;
      var categorySize = null;
      var bookmarkSize = null;
      var columns = null;
      var shadowAngle = null;
      var shadowSize = null;
      try {
        saved = localStorage.getItem('startpage-theme');
        categorySize = localStorage.getItem('startpage-category-font-size');
        bookmarkSize = localStorage.getItem('startpage-bookmark-font-size');
        columns = localStorage.getItem('startpage-grid-columns');
        shadowAngle = localStorage.getItem('startpage-shadow-angle');
        shadowSize = localStorage.getItem('startpage-shadow-size');
      } catch (e) { /* storage blocked */ }
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
      if (categorySize) document.documentElement.style.setProperty('--category-font-size', categorySize + 'rem');
      if (bookmarkSize) document.documentElement.style.setProperty('--bookmark-font-size', bookmarkSize + 'rem');
      if (columns) document.documentElement.style.setProperty('--grid-columns', columns);
      if (shadowAngle) document.documentElement.style.setProperty('--shadow-angle', shadowAngle + 'deg');
      if (shadowSize) document.documentElement.style.setProperty('--shadow-distance', shadowSize + 'px');
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="search-wrap">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search bookmarks…  (type to search)"
        autocomplete="off"
        autofocus
        spellcheck="false"
        aria-label="Search bookmarks">
      <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" title="Clear search" hidden>×</button>
    </div>
  </header>

  <main id="grid" class="grid" aria-live="polite"></main>

  <p id="empty" class="empty" hidden>No bookmarks found.</p>
  <div id="error" class="error" role="alert" hidden></div>

  <button id="settings-open" class="settings-toggle" type="button" aria-label="Open settings" title="Settings">⚙</button>

  <dialog id="settings" class="settings-dialog" aria-label="Settings">
    <form method="dialog" class="settings-form">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="settings-close" class="settings-close" type="submit" value="close" aria-label="Close settings" title="Close">×</button>
      </div>

      <div class="setting">
        <span class="setting-label">Theme</span>
        <div class="setting-controls">
          <button id="theme-light" class="setting-button" type="button" data-theme-value="light">☀ Light</button>
          <button id="theme-dark" class="setting-button" type="button" data-theme-value="dark">☾ Dark</button>
        </div>
      </div>

      <div class="setting">
        <span class="setting-label">Category font size</span>
        <div class="setting-controls">
          <button class="setting-button" type="button" data-size-target="category" data-size-step="-1" aria-label="Decrease category font size">−</button>
          <output id="category-size" class="setting-value"></output>
          <button class="setting-button" type="button" data-size-target="category" data-size-step="1" aria-label="Increase category font size">+</button>
        </div>
      </div>

      <div class="setting">
        <span class="setting-label">Bookmark font size</span>
        <div class="setting-controls">
          <button class="setting-button" type="button" data-size-target="bookmark" data-size-step="-1" aria-label="Decrease bookmark font size">−</button>
          <output id="bookmark-size" class="setting-value"></output>
          <button class="setting-button" type="button" data-size-target="bookmark" data-size-step="1" aria-label="Increase bookmark font size">+</button>
        </div>
      </div>

      <div class="setting">
        <span class="setting-label">Category columns</span>
        <div class="setting-controls">
          <button class="setting-button" type="button" data-columns-step="-1" aria-label="Decrease number of columns">−</button>
          <output id="columns-value" class="setting-value"></output>
          <button class="setting-button" type="button" data-columns-step="1" aria-label="Increase number of columns">+</button>
        </div>
      </div>

      <div class="setting">
        <span class="setting-label">Shadow angle</span>
        <div class="setting-controls">
          <button class="setting-button" type="button" data-angle-step="-1" aria-label="Decrease shadow angle">−</button>
          <output id="shadow-angle-value" class="setting-value"></output>
          <button class="setting-button" type="button" data-angle-step="1" aria-label="Increase shadow angle">+</button>
        </div>
      </div>

      <div class="setting">
        <span class="setting-label">Shadow size</span>
        <div class="setting-controls">
          <button class="setting-button" type="button" data-shadow-size-step="-1" aria-label="Decrease shadow size">−</button>
          <output id="shadow-size-value" class="setting-value"></output>
          <button class="setting-button" type="button" data-shadow-size-step="1" aria-label="Increase shadow size">+</button>
        </div>
      </div>

      <div class="setting">
        <label class="setting-label" for="tooltip-enabled">Show bookmark URLs on hover</label>
        <input id="tooltip-enabled" class="setting-checkbox" type="checkbox">
      </div>
    </form>
  </dialog>

  <script src="vendor/js-yaml.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
